 <link rel="manifest" href="manifest.json">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  html[data-theme="dark"] {
    --bg:#14171A; --surface:#1E2226; --surface2:#262B30;
    --text:#ECE9E4; --text-dim:#9BA3A8; --border:rgba(255,255,255,0.09);
    --accent:#E8A33D; --accent-ink:#3A2607; --good:#3FA34D; --warn:#E8A33D; --bad:#E0554A;
    --track: rgba(255,255,255,0.06);
  }
  html[data-theme="light"] {
    --bg:#F4F1EA; --surface:#FFFFFF; --surface2:#EFEAE0;
    --text:#211D18; --text-dim:#6E675D; --border:rgba(0,0,0,0.09);
    --accent:#C4791F; --accent-ink:#FFF6E8; --good:#2E8B42; --warn:#C4791F; --bad:#C43A30;
    --track: rgba(0,0,0,0.06);
  }
  body { background:var(--bg); color:var(--text); font-family:'Inter', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.head { font-family:'Barlow Condensed', sans-serif; letter-spacing:0.01em; margin:0; }
  .mono { font-family:'IBM Plex Mono', monospace; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; }
  .btn {
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
    border-radius:8px; padding:10px 16px; font-weight:600; cursor:pointer;
    border:1px solid var(--border); background:var(--surface2); color:var(--text);
    font-size:14px; font-family:inherit; text-decoration:none;
  }
  .btn:active { transform:scale(0.98); }
  .btn-accent { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn-sm { padding:6px 10px; font-size:13px; }
  input, select, textarea {
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:7px; padding:9px 10px; font-size:14px; font-family:inherit;
  }
  label.f-label { font-size:12px; color:var(--text-dim); margin-bottom:4px; display:block; }
  .tag { font-size:11px; padding:2px 8px; border-radius:99px; font-weight:600; display:inline-block; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; }
  .grid-stat { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .grid-quick { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
  .grid-cuotas { display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:8px; }
  .row-between { display:flex; justify-content:space-between; align-items:center; }
  .stack { display:flex; flex-direction:column; gap:16px; }
  .scroll::-webkit-scrollbar { width:6px; height:6px; }
  .scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:99px; }
  #app { min-height:100vh; }
  .layout { display:flex; min-height:100vh; }
  .sidebar { width:220px; flex-shrink:0; border-right:1px solid var(--border); padding:18px; overflow-y:auto; }
  .navbtn { display:flex; align-items:center; gap:10px; width:100%; text-align:left; justify-content:flex-start;
    background:transparent; border:none; color:var(--text); padding:9px 12px; border-radius:8px; cursor:pointer; font-size:13.5px; font-family:inherit; font-weight:600; }
  .navbtn.active { background:var(--accent); color:var(--accent-ink); }
  .content { flex:1; min-width:0; }
  .content-inner { padding:20px; max-width:1000px; margin:0 auto; }
  .topbar-mobile { display:none; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border); }
  @media (max-width:860px) {
    .sidebar { display:none; }
    .sidebar.open { display:block; position:fixed; z-index:20; background:var(--bg); height:100vh; top:0; left:0; }
    .topbar-mobile { display:flex; }
  }
  .cuota-btn { aspect-ratio:1; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer; }
  .thumb { width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--border); cursor:pointer; }
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .lightbox img { max-width:100%; max-height:100%; border-radius:8px; }
</style>

var _uidCounter = 0;
function uidStatic() { _uidCounter++; return "c" + _uidCounter + Math.random().toString(36).slice(2,6); }

function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return defaultData();
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state)); }
  catch (e) { alert("No se pudo guardar (posiblemente el almacenamiento del navegador está lleno, sobre todo por fotos). Descarga una copia de seguridad y considera eliminar alguna foto grande."); }
}

/* ================================================================ */
/* Utilidades                                                        */
/* ================================================================ */
function fmtCOP(n) { return "$" + Math.round(Number(n) || 0).toLocaleString("es-CO"); }
function daysUntil(iso) {
  if (!iso) return null;
  var today = new Date(); today.setHours(0,0,0,0);
  var target = new Date(iso + "T00:00:00");
  return Math.round((target - today) / 86400000);
}
function fmtDate(iso) {
  if (!iso) return "—";
  var d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("es-CO", { day:"2-digit", month:"2-digit", year:"numeric" });
}
function uid() { return Math.random().toString(36).slice(2,10); }
function esc(v) { return (v === undefined || v === null) ? "" : String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function toneVar(t) { return t === "good" ? "var(--good)" : t === "bad" ? "var(--bad)" : "var(--warn)"; }
function pill(tone, text) {
  var c = toneVar(tone);
  return '<span class="tag" style="background:'+c+'22;color:'+c+';border:1px solid '+c+'55">'+esc(text)+'</span>';
}
function getPath(obj, path) {
  return path.split(".").reduce(function(o,k){ return (o===undefined||o===null) ? undefined : o[k]; }, obj);
}
function setPath(obj, path, value) {
  var parts = path.split(".");
  var cur = obj;
  for (var i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  cur[parts[parts.length - 1]] = value;
}
function readFileAsDataURL(file, cb) {
  var r = new FileReader();
  r.onload = function() { cb(r.result); };
  r.readAsDataURL(file);
}

/* ================================================================ */
/* Cálculos                                                           */
/* ================================================================ */
function computeTotals(d) {
  var totalCuotasValor = d.cuotas.reduce(function(s,c){ return s + (Number(c.valor)||0); }, 0);
  var totalFinanciado = d.financiacion.capital > 0 ? Number(d.financiacion.capital) : totalCuotasValor;
  var totalPagadoCuotas = d.pagos.reduce(function(s,p){ return s + (Number(p.valor)||0); }, 0);
  var cuotaInicial = Number(d.financiacion.cuotaInicial && d.financiacion.cuotaInicial.valor || 0);
  var totalPagado = totalPagadoCuotas + cuotaInicial;
  var saldoPendiente = Math.max(0, totalFinanciado - totalPagadoCuotas);
  var cuotasPagadas = d.cuotas.filter(function(c){ return c.estado === "pagada"; }).length;
  var cuotasParciales = d.cuotas.filter(function(c){ return c.estado === "parcial"; }).length;
  var cuotasPendientes = d.cuotas.length - cuotasPagadas - cuotasParciales;
  var pct = totalFinanciado > 0 ? (totalPagadoCuotas / totalFinanciado) * 100 : 0;
  var proxima = d.cuotas.find(function(c){ return c.estado !== "pagada" && c.fecha; }) ||
                d.cuotas.find(function(c){ return c.estado !== "pagada"; });
  return { totalFinanciado:totalFinanciado, totalPagado:totalPagado, cuotaInicial:cuotaInicial,
    saldoPendiente:saldoPendiente, cuotasPagadas:cuotasPagadas, cuotasParciales:cuotasParciales,
    cuotasPendientes:cuotasPendientes, pct:pct, proxima:proxima };
}

function nextAceiteKm(d) {
  var m = d.mantenimiento.aceite;
  var hist = m.historial;
  var last = 0;
  hist.forEach(function(h){ if (Number(h.kilometraje) > last) last = Number(h.kilometraje); });
  var intervalo = Number(m.intervaloKm) || 5000;
  var next = last + intervalo;
  while (next <= d.moto.kmActual) next += intervalo;
  return next;
}
function nextRevisionKm(d) {
  var m = d.mantenimiento.revisiones;
  var km = d.moto.kmActual;
  var fixed = m.puntos.slice().sort(function(a,b){ return a-b; });
  for (var i = 0; i < fixed.length; i++) if (fixed[i] > km) return fixed[i];
  var last = fixed[fixed.length - 1] || 0;
  var intervalo = Number(m.intervaloContinuo) || 5000;
  var next = last + intervalo;
  while (next <= km) next += intervalo;
  return next;
}
function nextGenericKm(intervalo, ultimoKm, kmActual) {
  if (!intervalo || intervalo <= 0) return null;
  var next = Number(ultimoKm || 0) + Number(intervalo);
  while (next <= kmActual) next += Number(intervalo);
  return next;
}

function buildAlerts(d, totals) {
  var alerts = [];
  var p = totals.proxima;
  if (p && p.fecha) {
    var dd = daysUntil(p.fecha);
    if (dd < 0) alerts.push({tone:"bad", text:"Cuota #"+p.numero+" vencida hace "+Math.abs(dd)+" día(s)."});
    else if (dd === 0) alerts.push({tone:"bad", text:"Cuota #"+p.numero+" vence hoy."});
    else if (dd <= 7) alerts.push({tone:"warn", text:"Cuota #"+p.numero+" vence en "+dd+" día(s)."});
  }
  var km = d.moto.kmActual;
  var proxAceite = nextAceiteKm(d);
  if (proxAceite - km <= 300) alerts.push({tone:"warn", text:"Cambio de aceite en "+(proxAceite-km)+" km (a los "+proxAceite.toLocaleString("es-CO")+" km)."});
  var proxRev = nextRevisionKm(d);
  if (proxRev - km <= 300) alerts.push({tone:"warn", text:"Mantenimiento/revisión en "+(proxRev-km)+" km (a los "+proxRev.toLocaleString("es-CO")+" km)."});
    var revPuntos = (d.mantenimiento.revisiones.puntos || []).slice().sort(function(a,b){ return a-b; });
  var revPagas = d.mantenimiento.revisiones.pagas || [10000];
  revPuntos.forEach(function(pt, idx){
    if (revPagas.indexOf(pt) === -1) return;
    var prev = idx > 0 ? revPuntos[idx-1] : 0;
    var half = prev + (pt - prev) / 2;
    if (km >= half && km < pt) {
      alerts.push({tone:"warn", text:"Vas a la mitad del camino hacia tu revisión de "+pt.toLocaleString("es-CO")+" km — recuerda que esa revisión es PAGADA por ti."});
    }
  });
  if (d.soat.vigenciaFin) {
    var dsoat = daysUntil(d.soat.vigenciaFin);
    if (dsoat < 0) alerts.push({tone:"bad", text:"El SOAT está vencido."});
    else if (dsoat <= 30) alerts.push({tone:"warn", text:"El SOAT vence en "+dsoat+" día(s)."});
  }
  if (d.garantiaSuplementaria.vigenciaFin) {
    var dgar = daysUntil(d.garantiaSuplementaria.vigenciaFin);
    if (dgar >= 0 && dgar <= 30) alerts.push({tone:"warn", text:"La garantía suplementaria vence en "+dgar+" día(s)."});
  }
  var pendCompras = d.compras.lista.filter(function(i){ return i.estado === "pendiente"; }).length;
  if (pendCompras > 0) alerts.push({tone:"warn", text: pendCompras + " producto(s) pendientes por comprar."});
  return alerts;
}

  login: function(ev) {
    ev.preventDefault();

  setTab: function(id) { this.ui.tab = id; this.ui.navOpen = false; this.render(); },

  toggleTheme: function() { this.state.theme = this.state.theme === "dark" ? "light" : "dark"; this.save(); this.render(); },

  updateField: function(path, value, isNumber) {
    setPath(this.state, path, isNumber ? Number(value) : value);

  },
  uploadPhoto: function(path, inputEl) {

    if (!file) return;

  /* ---------- financiación / pagos ---------- */
  updateNumCuotas: function(value) {
    var n = Math.max(1, Number(value) || 1);

    if (n > d.cuotas.length) {
      for (var i = d.cuotas.length + 1; i <= n; i++) {
        d.cuotas.push({ numero:i, fecha:"", valor:d.financiacion.valorCuotaProvisional, capital:0, interes:0,
          capitalFinal:0, estado:"pendiente", fechaPagoReal:"", valorPagado:0, comprobante:"", observaciones:"", provisional:true, historial:[] });
      }
    } else if (n < d.cuotas.length) { d.cuotas = d.cuotas.slice(0, n); }
    this.save(); this.render();
  },
  openPagoForm: function() {
    this.ui.pagoForm = { fecha:new Date().toISOString().slice(0,10), hora:new Date().toTimeString().slice(0,5),
      valor:"", tipo:"Cuota completa", cuota:"", medio:"", cuenta:"", observaciones:"", comprobante:"", comprobanteFoto:"" };
    this.render();
  },
  cancelPagoForm: function() { this.ui.pagoForm = null; this.render(); },
  updatePagoField: function(field, value) { if (this.ui.pagoForm) this.ui.pagoForm[field] = value; },
  uploadPagoFoto: function(inputEl) {
    var file = inputEl.files[0]; if (!file || !this.ui.pagoForm) return;
    readFileAsDataURL(file, function(dataUrl) { App.ui.pagoForm.comprobanteFoto = dataUrl; App.render(); });
  },
  savePago: function() {
    var f = this.ui.pagoForm;
    if (!f || !f.valor) return;
    var d = this.state;
    var saldoAntes = computeTotals(d).saldoPendiente;
    var pago = { id:uid(), fecha:f.fecha, hora:f.hora, valor:Number(f.valor), tipo:f.tipo,
      cuota:f.cuota, medio:f.medio, cuenta:f.cuenta, observaciones:f.observaciones,
      comprobante:f.comprobante, comprobanteFoto:f.comprobanteFoto || "" };
    d.pagos.unshift(pago);
    if (pago.tipo === "Cuota completa" && pago.cuota) {
      var c = d.cuotas.find(function(x){ return x.numero === Number(pago.cuota); });
      if (c) { c.estado = "pagada"; c.valorPagado = pago.valor; c.fechaPagoReal = pago.fecha; c.comprobante = pago.comprobante; }
    } else if (pago.tipo === "Abono" || pago.tipo === "Pago anticipado") {
      var monto = Number(pago.valor);
      var startAt = pago.cuota ? Number(pago.cuota) : null;
      var ordered = d.cuotas.slice().sort(function(a,b){ return a.numero - b.numero; });
      for (var i = 0; i < ordered.length; i++) {
        var c2 = ordered[i];
        if (monto <= 0) break;
        if (c2.estado === "pagada") continue;
        if (startAt && c2.numero < startAt) continue;
        var need = Number(c2.valor) - Number(c2.valorPagado || 0);
        if (need <= 0) continue;
        if (monto >= need) { c2.valorPagado = c2.valor; c2.estado = "pagada"; c2.fechaPagoReal = pago.fecha; monto -= need; }
        else { c2.valorPagado = Number(c2.valorPagado || 0) + monto; c2.estado = "parcial"; monto = 0; }
      }
      d.financiacion.saldoAFavor = Number(d.financiacion.saldoAFavor || 0) + monto;
    }
    pago.saldoDespues = Math.max(0, saldoAntes - pago.valor);
    this.ui.pagoForm = null;
    this.save(); this.render();
  },

        '<div style="margin-top:10px;">' + field("📷 Subir foto del comprobante", '<input type="file" accept="image/*" onchange="App.uploadPagoFoto(this)" />') +
          (pf.comprobanteFoto ? '<img src="' + pf.comprobanteFoto + '" class="thumb" style="margin-top:6px;" onclick="App.viewDoc(\'' + pf.comprobanteFoto.replace(/'/g,"") + '\')" />' : '') + '</div>' +
        '<div style="display:flex;gap:8px;margin-top:14px;">' +
          '<button class="btn btn-accent" onclick="App.savePago()">Guardar pago</button>' +
          '<button class="btn" onclick="App.cancelPagoForm()">Cancelar</button>' +
        '</div>' +
      '</div>';
    }

    var historialHtml = pagosFiltrados.length === 0
      ? '<div style="color:var(--text-dim);font-size:14px;">Aún no hay pagos registrados.</div>'
      : '<div class="scroll" style="display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;">' +
        pagosFiltrados.map(function(p){
          return '<div style="display:flex;gap:10px;padding:8px 10px;background:var(--surface2);border-radius:8px;font-size:13px;align-items:center;">' +
            (p.comprobanteFoto ? '<img src="' + p.comprobanteFoto + '" class="thumb" style="width:44px;height:44px;" onclick="App.viewDoc(\'' + p.comprobanteFoto.replace(/'/g,"") + '\')" />' : '') +
            '<div><div style="font-weight:600;">' + fmtCOP(p.valor) + ' · ' + esc(p.tipo) + (p.cuota ? (' · Cuota #' + p.cuota) : '') + '</div>' +
            '<div style="color:var(--text-dim);">' + fmtDate(p.fecha) + ' ' + esc(p.hora) + ' · ' + esc(p.medio) + (p.cuenta ? (' · ' + esc(p.cuenta)) : '') +
            (p.saldoDespues !== undefined ? (' · Saldo después: ' + fmtCOP(p.saldoDespues)) : '') + '</div>' +
            (p.observaciones ? '<div style="color:var(--text-dim);">' + esc(p.observaciones) + '</div>' : '') + '</div>' +
          '</div>';
        }).join("") + '</div>';

    return '<div class="stack">' +
      sectionTitle("Financiación", esc(f.entidad)) +

      infoCard("💰 Cuota inicial", '<div class="grid2">' +
        field("Valor de la cuota inicial", '<input type="number" value="' + f.cuotaInicial.valor + '" onchange="App.updateField(\'financiacion.cuotaInicial.valor\', this.value, true)" />') +
        field("Fecha", '<input type="date" value="' + esc(f.cuotaInicial.fecha) + '" onchange="App.updateField(\'financiacion.cuotaInicial.fecha\', this.value)" />') +
      '</div><div style="font-size:12px;color:var(--text-dim);margin-top:8px;">Se cuenta dentro del total pagado, separada de las 49 cuotas.</div>') +

      '<div class="card" style="padding:16px;">' +
        '<div class="row-between" style="margin-bottom:10px;"><div style="font-weight:600;">Configuración de la financiación</div>' +
        (f.capital === 0 ? pill("warn","Valores provisionales") : '') + '</div>' +
        '<div style="font-size:13px;color:var(--text-dim);margin-bottom:12px;">Mientras no tengas la tabla de amortización legible, el sistema usa ' + fmtCOP(f.valorCuotaProvisional) + ' por cuota como referencia provisional. Edita cada cuota en la pestaña "Cuotas" cuando tengas los valores reales — no se inventan cifras.</div>' +
        '<div class="grid2">' +
          field("Número de cuotas", '<input type="number" value="' + f.numCuotas + '" onchange="App.updateNumCuotas(this.value)" />') +
          field("Valor cuota provisional", '<input type="number" value="' + f.valorCuotaProvisional + '" onchange="App.updateField(\'financiacion.valorCuotaProvisional\', this.value, true)" />') +
          field("Capital financiado (si lo conoces)", '<input type="number" value="' + f.capital + '" onchange="App.updateField(\'financiacion.capital\', this.value, true)" />') +
          field("Tasa de interés", '<input value="' + esc(f.tasa) + '" placeholder="Ej: 1.8% M.V." onchange="App.updateField(\'financiacion.tasa\', this.value)" />') +
          field("Fecha primera cuota", '<input type="date" value="' + esc(f.fechaPrimera) + '" onchange="App.updateField(\'financiacion.fechaPrimera\', this.value)" />') +
          field("Fecha última cuota", '<input type="date" value="' + esc(f.fechaUltima) + '" onchange="App.updateField(\'financiacion.fechaUltima\', this.value)" />') +
          field("Otros cobros", '<input value="' + esc(f.otrosCobros) + '" onchange="App.updateField(\'financiacion.otrosCobros\', this.value)" />') +
        '</div>' +
        (f.saldoAFavor > 0 ? '<div style="margin-top:10px;font-size:13px;color:var(--good);">Saldo a favor sin aplicar: ' + fmtCOP(f.saldoAFavor) + '</div>' : '') +
      '</div>' +

      '<div class="grid-stat">' +
        '<div class="card" style="padding:14px;"><div style="font-size:12px;color:var(--text-dim);">Total financiado (49 cuotas)</div><div class="mono" style="font-size:19px;font-weight:600;">' + fmtCOP(totals.totalFinanciado) + '</div></div>' +
        '<div class="card" style="padding:14px;"><div style="font-size:12px;color:var(--text-dim);">Total pagado (incl. cuota inicial)</div><div class="mono" style="font-size:19px;font-weight:600;">' + fmtCOP(totals.totalPagado) + '</div></div>' +
        '<div class="card" style="padding:14px;"><div style="font-size:12px;color:var(--text-dim);">Saldo pendiente</div><div class="mono" style="font-size:19px;font-weight:600;">' + fmtCOP(totals.saldoPendiente) + '</div></div>' +
        '<div class="card" style="padding:14px;"><div style="font-size:12px;color:var(--text-dim);">% pagado (de las cuotas)</div><div class="mono" style="font-size:19px;font-weight:600;">' + totals.pct.toFixed(1) + '%</div></div>' +
      '</div>' +

      (this.ui.pagoForm ? '' : '<button class="btn btn-accent" style="align-self:flex-start;width:fit-content;" onclick="App.openPagoForm()">➕ Registrar pago</button>') +
      pagoFormHtml +

      '<div class="card" style="padding:16px;">' +
        '<div class="row-between" style="margin-bottom:10px;flex-wrap:wrap;gap:8px;">' +
        '<div style="font-weight:600;">Historial de pagos (' + d.pagos.length + ')</div>' +
        '<select style="width:170px;" onchange="App.setFilterTipo(this.value)">' +
          '<option value="">Todos los tipos</option>' +
          ["Cuota completa","Abono","Pago anticipado","Otro"].map(function(t){ return '<option' + (t===App.ui.filterTipo?' selected':'') + '>' + t + '</option>'; }).join("") +
        '</select></div>' +
        historialHtml +
      '</div>' +
    '</div>';
  },

  /* ---------- Cuotas ---------- */
  renderCuotas: function() {
    var d = this.state;
    var grid = d.cuotas.map(function(c){
      var tone = c.estado === "pagada" ? "good" : c.estado === "parcial" ? "warn" : "bad";
      var col = toneVar(tone);
      return '<button class="cuota-btn mono" style="background:' + col + '22;color:' + col + ';border:1px solid ' + col + '66;" onclick="App.selectCuota(' + c.numero + ')">' +
        String(c.numero).padStart(2,"0") + '</button>';
    }).join("");

    var detail = "";
    if (this.ui.selCuota) {
      var c = d.cuotas.find(function(x){ return x.numero === App.ui.selCuota; });
      if (c) {
        var histHtml = "";
        if (this.ui.showCuotaHist) {
          histHtml = (c.historial && c.historial.length)
            ? '<div class="scroll" style="max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-top:10px;">' +
              c.historial.map(function(h){ return '<div style="font-size:12px;background:var(--surface2);padding:6px 8px;border-radius:6px;">' + esc(h.fecha) + ' · ' + esc(h.campo) + ': ' + esc(h.valorAnterior) + ' → ' + esc(h.valorNuevo) + '</div>'; }).join("") + '</div>'
            : '<div style="font-size:12px;color:var(--text-dim);margin-top:10px;">Sin cambios registrados todavía.</div>';
        }
        detail = '<div class="card" style="padding:18px;">' +
          '<div class="row-between" style="margin-bottom:12px;"><div style="font-weight:600;">Cuota #' + c.numero + ' ' + (c.provisional ? pill("warn","Provisional") : '') + '</div>' +
          '<button class="btn btn-sm" onclick="App.closeCuota()">✕</button></div>' +
          '<div class="grid2">' +
            field("Fecha programada", '<input type="date" value="' + esc(c.fecha) + '" onchange="App.saveCuotaField(' + c.numero + ',\'fecha\',this.value)" />') +
            field("Valor cuota", '<input type="number" value="' + c.valor + '" onchange="App.saveCuotaField(' + c.numero + ',\'valor\',this.value,true)" />') +
            field("Capital", '<input type="number" value="' + c.capital + '" onchange="App.saveCuotaField(' + c.numero + ',\'capital\',this.value,true)" />') +
            field("Interés", '<input type="number" value="' + c.interes + '" onchange="App.saveCuotaField(' + c.numero + ',\'interes\',this.value,true)" />') +
            field("Estado", '<select onchange="App.saveCuotaField(' + c.numero + ',\'estado\',this.value)">' +
              ["pendiente","parcial","pagada"].map(function(s){ return '<option value="' + s + '"' + (s===c.estado?' selected':'') + '>' + s.charAt(0).toUpperCase()+s.slice(1) + '</option>'; }).join("") + '</select>') +
            field("Fecha real de pago", '<input type="date" value="' + esc(c.fechaPagoReal) + '" onchange="App.saveCuotaField(' + c.numero + ',\'fechaPagoReal\',this.value)" />') +
            field("Valor realmente pagado", '<input type="number" value="' + c.valorPagado + '" onchange="App.saveCuotaField(' + c.numero + ',\'valorPagado\',this.value,true)" />') +
            field("Comprobante", '<input value="' + esc(c.comprobante) + '" onchange="App.saveCuotaField(' + c.numero + ',\'comprobante\',this.value)" />') +
          '</div>' +
          '<div style="margin-top:10px;">' + field("Observaciones", '<textarea rows="2" onchange="App.saveCuotaField(' + c.numero + ',\'observaciones\',this.value)">' + esc(c.observaciones) + '</textarea>') + '</div>' +
          '<button class="btn btn-sm" style="margin-top:10px;" onclick="App.toggleCuotaHist()">✏️ ' + (this.ui.showCuotaHist ? "Ocultar" : "Ver") + ' historial de cambios</button>' +
          histHtml +
        '</div>';
      }
    }

    return '<div class="stack">' +
      sectionTitle("Control de cuotas", d.cuotas.length + " cuotas — toca una para ver o editar el detalle") +
      '<div style="display:flex;gap:14px;font-size:12px;color:var(--text-dim);">' +
        '<span>' + pill("bad","·") + ' Pendiente</span><span>' + pill("warn","·") + ' Parcial</span><span>' + pill("good","·") + ' Pagada</span>' +
      '</div>' +
      '<div class="grid-cuotas">' + grid + '</div>' +
      detail +
    '</div>';
  },

  /* ---------- Mantenimiento ---------- */
  renderMantenimiento: function() {
    var d = this.state;
    var km = d.moto.kmActual;
    var proxAceite = nextAceiteKm(d);
    var proxRev = nextRevisionKm(d);

    var histKmHtml = d.mantenimiento.kmActualHistorial.slice(0,8).map(function(h){
      return '<div style="font-size:12px;color:var(--text-dim);">' + fmtDate(h.fecha) + ' ' + h.hora + ' — ' + h.km.toLocaleString("es-CO") + ' km</div>';
    }).join("");

    var aceiteForm = "";
    if (this.ui.openMaint.aceite) {
      var af = this.ui.maintForm.aceite || {};
      aceiteForm = '<div class="grid2" style="margin:10px 0;">' +
        field("Fecha", '<input type="date" value="' + esc(af.fecha||"") + '" onchange="App.updateMaintForm(\'aceite\',\'fecha\',this.value)" />') +
        field("Kilometraje", '<input type="number" value="' + esc(af.kilometraje||"") + '" onchange="App.updateMaintForm(\'aceite\',\'kilometraje\',this.value)" />') +
        field("Tipo de aceite", '<input value="' + esc(af.tipoAceite||"") + '" onchange="App.updateMaintForm(\'aceite\',\'tipoAceite\',this.value)" />') +
        field("Cantidad", '<input value="' + esc(af.cantidad||"") + '" onchange="App.updateMaintForm(\'aceite\',\'cantidad\',this.value)" />') +
        field("Valor", '<input type="number" value="' + esc(af.valor||"") + '" onchange="App.updateMaintForm(\'aceite\',\'valor\',this.value)" />') +
        field("Lugar", '<input value="' + esc(af.lugar||"") + '" onchange="App.updateMaintForm(\'aceite\',\'lugar\',this.value)" />') +
        field("Observaciones", '<input value="' + esc(af.observaciones||"") + '" onchange="App.updateMaintForm(\'aceite\',\'observaciones\',this.value)" />') +
        field("📷 Foto/comprobante", '<input type="file" accept="image/*" onchange="App.uploadMaintFoto(\'aceite\', this)" />') +
        '<div style="align-self:end;"><button class="btn btn-accent" onclick="App.addMaintEntry(\'aceite\')">Guardar</button></div>' +
      '</div>';
    }
    var aceiteHist = d.mantenimiento.aceite.historial.length
      ? '<div class="scroll" style="display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;">' +
        d.mantenimiento.aceite.historial.map(function(h){
          return '<div style="font-size:13px;background:var(--surface2);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;">' +
            (h.foto ? '<img src="' + h.foto + '" class="thumb" style="width:36px;height:36px;" onclick="App.viewDoc(\'' + h.foto.replace(/'/g,"") + '\')" />' : '') +
            '<div>' + fmtDate(h.fecha) + (h.kilometraje ? (' · ' + esc(h.kilometraje) + ' km') : '') + (h.tipoAceite ? (' · ' + esc(h.tipoAceite)) : '') + (h.valor ? (' · ' + fmtCOP(h.valor)) : '') + '</div></div>';
        }).join("") + '</div>' : '';

    var revForm = "";
    if (this.ui.openMaint.revisiones) {
      var rf = this.ui.maintForm.revisiones || {};
      revForm = '<div class="grid2" style="margin:10px 0;">' +
        field("Fecha", '<input type="date" value="' + esc(rf.fecha||"") + '" onchange="App.updateMaintForm(\'revisiones\',\'fecha\',this.value)" />') +
        field("Kilometraje", '<input type="number" value="' + esc(rf.kilometraje||"") + '" onchange="App.updateMaintForm(\'revisiones\',\'kilometraje\',this.value)" />') +
        field("Tipo de revisión", '<input value="' + esc(rf.tipoRevision||"") + '" onchange="App.updateMaintForm(\'revisiones\',\'tipoRevision\',this.value)" />') +
        field("Lugar", '<input value="' + esc(rf.lugar||"") + '" onchange="App.updateMaintForm(\'revisiones\',\'lugar\',this.value)" />') +
        field("Valor pagado", '<input type="number" value="' + esc(rf.valor||"") + '" onchange="App.updateMaintForm(\'revisiones\',\'valor\',this.value)" />') +
        field("Observaciones", '<input value="' + esc(rf.observaciones||"") + '" onchange="App.updateMaintForm(\'revisiones\',\'observaciones\',this.value)" />') +
        field("📷 Foto/comprobante", '<input type="file" accept="image/*" onchange="App.uploadMaintFoto(\'revisiones\', this)" />') +
        '<div style="align-self:end;"><button class="btn btn-accent" onclick="App.addMaintEntry(\'revisiones\')">Guardar</button></div>' +
      '</div>';
    }
    var revHist = d.mantenimiento.revisiones.historial.length
      ? '<div class="scroll" style="display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;">' +
        d.mantenimiento.revisiones.historial.map(function(h){
          return '<div style="font-size:13px;background:var(--surface2);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;">' +
            (h.foto ? '<img src="' + h.foto + '" class="thumb" style="width:36px;height:36px;" onclick="App.viewDoc(\'' + h.foto.replace(/'/g,"") + '\')" />' : '') +
            '<div>' + fmtDate(h.fecha) + (h.kilometraje ? (' · ' + esc(h.kilometraje) + ' km') : '') + (h.tipoRevision ? (' · ' + esc(h.tipoRevision)) : '') + (h.valor ? (' · ' + fmtCOP(h.valor)) : '') + '</div></div>';
        }).join("") + '</div>' : '';

    var componentesHtml = d.mantenimiento.componentes.map(function(c){
      var next = nextGenericKm(c.intervaloKm, c.ultimoKm, km);
      return '<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">' +
        '<div>' + esc(c.nombre) + ' ' + pill(c.tipo === "manual" ? "good" : "warn", c.tipo === "manual" ? "Según manual" : "Intervalo estimado") + '</div>' +
        '<input type="number" placeholder="Intervalo km" value="' + (c.intervaloKm || "") + '" onchange="App.updateComponente(\'' + c.id + '\',\'intervaloKm\',this.value,true)" />' +
        '<div style="color:var(--text-dim);">' + (next ? ("Próximo: " + next.toLocaleString("es-CO") + " km") : "Revisar según estado") + '</div>' +
        '<button class="btn btn-sm" onclick="App.marcarComponenteRealizado(\'' + c.id + '\')">✔ Hecho</button>' +
      '</div>';
    }).join("");

    return '<div class="stack">' +
      sectionTitle("Mantenimiento", "Basado en el manual oficial de Auteco para la MRX 150") +

      '<div class="card" style="padding:16px;">' +
        field("Kilometraje actual de la moto", '<input type="number" style="max-width:220px;" value="' + km + '" onchange="App.setKmActual(this.value)" />') +
        (histKmHtml ? '<div style="margin-top:10px;"><div class="f-label">Últimas actualizaciones</div>' + histKmHtml + '</div>' : '') +
      '</div>' +

      '<div class="card" style="padding:16px;">' +
        '<div class="row-between" style="margin-bottom:10px;"><div style="display:flex;align-items:center;gap:8px;font-weight:600;">💧 Cambio de aceite ' + pill("good","Según manual") + '</div>' +
        '<button class="btn btn-sm" onclick="App.toggleMaint(\'aceite\')">➕ Registrar cambio</button></div>' +
        '<div style="font-size:13px;color:var(--text-dim);margin-bottom:6px;">Especificación del manual: ' + esc(d.mantenimiento.aceite.especificacion) + '</div>' +
        '<div class="grid2" style="margin-bottom:10px;">' + field("Intervalo (km)", '<input type="number" value="' + d.mantenimiento.aceite.intervaloKm + '" onchange="App.updateMaintConfig(\'aceite\',\'intervaloKm\',this.value,true)" />') + '</div>' +
        '<div style="font-size:14px;margin-bottom:10px;">🛢️ Próximo cambio: <b>' + proxAceite.toLocaleString("es-CO") + ' km</b> — faltan ' + (proxAceite-km).toLocaleString("es-CO") + ' km</div>' +
        aceiteForm + aceiteHist +
      '</div>' +

      '<div class="card" style="padding:16px;">' +
        '<div class="row-between" style="margin-bottom:10px;"><div style="display:flex;align-items:center;gap:8px;font-weight:600;">🔧 Revisiones técnicas ' + pill("good","Según manual") + '</div>' +
        '<button class="btn btn-sm" onclick="App.toggleMaint(\'revisiones\')">➕ Registrar revisión</button></div>' +
        '<div class="grid2" style="margin-bottom:10px;">' +
          field("Puntos fijos (km, separados por coma)", '<input value="' + d.mantenimiento.revisiones.puntos.join(",") + '" onchange="App.updateRevisionPuntos(this.value)" />') +
          field("Intervalo continuo después del último punto", '<input type="number" value="' + d.mantenimiento.revisiones.intervaloContinuo + '" onchange="App.updateMaintConfig(\'revisiones\',\'intervaloContinuo\',this.value,true)" />') +
        '</div>' +
                '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">' + d.mantenimiento.revisiones.puntos.map(function(p){
          var esPaga = (d.mantenimiento.revisiones.pagas || [10000]).indexOf(p) !== -1;
          return pill(p<=km?"good":"warn", p.toLocaleString("es-CO")+" km" + (esPaga ? " 💰 paga" : ""));
        }).join(" ") + '</div>' +
        field("Revisiones pagadas por ti (km, separados por coma)", '<input value="' + (d.mantenimiento.revisiones.pagas || [10000]).join(",") + '" onchange="App.updateRevisionesPagas(this.value)" />') + '</div>' +
        '<div style="font-size:14px;margin-bottom:10px;">🔧 Próxima revisión: <b>' + proxRev.toLocaleString("es-CO") + ' km</b> — faltan ' + (proxRev-km).toLocaleString("es-CO") + ' km</div>' +
        revForm + revHist +
      '</div>' +

      infoCard("🧰 Mantenimiento completo por componente", '<div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;">El manual no especifica un kilometraje exacto para cada pieza; configura el intervalo cuando lo sepas o revísala según su estado.</div>' + componentesHtml) +
    '</div>';
  },

  /* ---------- Combustible ---------- */
  renderCombustible: function() {
    var d = this.state;
    var ordered = d.tanqueos.slice().sort(function(a,b){ return a.km - b.km; });
    var withDist = ordered.map(function(t, i){
      var prev = i > 0 ? ordered[i-1] : null;
      return Object.assign({}, t, { recorrido: prev ? (t.km - prev.km) : null });
    });
    var byId = {}; withDist.forEach(function(t){ byId[t.id] = t; });
    var display = d.tanqueos.map(function(t){ return byId[t.id] || t; });

    var totalGastado = d.tanqueos.reduce(function(s,t){ return s + (Number(t.valor)||0); }, 0);
    var promedio = d.tanqueos.length ? totalGastado / d.tanqueos.length : 0;

    var formHtml = "";
    if (this.ui.tanqueoForm) {
      var tf = this.ui.tanqueoForm;
      formHtml = '<div class="card" style="padding:18px;">' +
        '<div class="row-between" style="margin-bottom:12px;"><div style="font-weight:600;">Registrar tanqueo</div><button class="btn btn-sm" onclick="App.cancelTanqueoForm()">✕</button></div>' +
        '<div class="grid2">' +
          field("Fecha", '<input type="date" value="' + esc(tf.fecha) + '" onchange="App.updateTanqueoField(\'fecha\',this.value)" />') +
          field("Hora", '<input type="time" value="' + esc(tf.hora) + '" onchange="App.updateTanqueoField(\'hora\',this.value)" />') +
          field("Kilometraje", '<input type="number" value="' + esc(tf.km) + '" onchange="App.updateTanqueoField(\'km\',this.value)" />') +
          field("Dinero pagado", '<input type="number" value="' + esc(tf.valor) + '" onchange="App.updateTanqueoField(\'valor\',this.value)" />') +
          field("Cantidad (galones/litros, opcional)", '<input value="' + esc(tf.cantidad) + '" onchange="App.updateTanqueoField(\'cantidad\',this.value)" />') +
          field("Precio por unidad (opcional)", '<input value="' + esc(tf.precioUnidad) + '" onchange="App.updateTanqueoField(\'precioUnidad\',this.value)" />') +
          field("Estación de servicio", '<input value="' + esc(tf.estacion) + '" onchange="App.updateTanqueoField(\'estacion\',this.value)" />') +
        '</div>' +

        '<div><div style="font-weight:600;">' + esc(c.nombre) + ' — ' + esc(c.rol) + '</div><div class="mono" style="color:var(--text-dim);">' + esc(c.telefono) + '</div></div>' +
        '<div style="display:flex;gap:6px;"><a class="btn btn-sm" href="tel:' + esc(c.telefono) + '">📞 Llamar</a>' +
        '<button class="btn btn-sm" onclick="App.copyText(\'' + c.telefono + '\')">📋 Copiar</button></div></div>';
    }).join("");

    return '<div class="stack">' +
      sectionTitle("Cuentas y pago", "Todo lo necesario para pagar rápido") +
      '<div class="grid-quick">' + cuentasHtml + '</div>' +
      '<a href="' + esc(d.linkPago) + '" target="_blank" rel="noreferrer" class="btn btn-accent" style="width:fit-content;">💳 Hacer pago</a>' +
      infoCard("👩‍💼 Contacto de caja", contactosHtml +
        '<div style="font-size:12px;color:var(--text-dim);margin-top:10px;">Para cualquier pago o consulta, ten a la mano tu nombre completo, cédula y los datos del titular.</div>') +
    '</div>';
  },

  /* ---------- Configuración ---------- */
  renderConfig: function() {
    var d = this.state;
    return '<div class="stack">' +
      sectionTitle("Configuración") +
      infoCard("Apariencia", '<button class="btn" onclick="App.toggleTheme()">' + (d.theme === "dark" ? "☀️" : "🌙") + ' Cambiar a modo ' + (d.theme === "dark" ? "claro" : "oscuro") + '</button>') +

      infoCard("🔐 Usuario y contraseña", '<div class="grid2">' +
        field("Usuario", '<input id="cfg-user" value="' + esc(d.auth.username) + '" />') +
        field("Nueva contraseña", '<input id="cfg-pass" type="password" placeholder="Dejar vacío para no cambiar" />') +
        '</div><button class="btn btn-accent" style="margin-top:10px;" onclick="App.updateCredentials()">Guardar credenciales</button>' +
        '<div id="cfg-msg" style="color:var(--good);font-size:13px;margin-top:8px;"></div>') +

      infoCard("💾 Copia de seguridad", '<div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;">Guarda o restaura toda la información de la plataforma, incluyendo fotos, en un archivo de texto.</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
        '<button class="btn" onclick="App.downloadBackup()">💾 Hacer copia de seguridad</button>' +
        '<label class="btn" style="cursor:pointer;">♻️ Restaurar copia<input type="file" accept="application/json" style="display:none;" onchange="App.restoreBackup(this)" /></label>' +
        '</div>') +

      '<div style="font-size:12px;color:var(--text-dim);line-height:1.6;">' +
      '<b>Notas técnicas honestas:</b><br/>' +
      '• Este archivo guarda todo (datos y fotos) en el almacenamiento local (localStorage) de este navegador. Persiste al cerrar la pestaña o reiniciar el equipo, pero <b>solo en este mismo navegador y dispositivo</b>; no se sincroniza solo con tu teléfono. Usa la copia de seguridad para pasar la información de un dispositivo a otro.<br/>' +
      '• Las fotos ocupan bastante espacio: si el navegador se queda sin cupo al guardar, te avisará; en ese caso descarga una copia y evita subir demasiadas fotos de alta resolución.<br/>' +
      '• Un archivo HTML abierto localmente no puede instalarse como PWA verdadera (eso requiere un servidor con HTTPS, manifest.json y service worker) ni sincronizar automáticamente varios dispositivos en tiempo real — eso sí necesita el backend (Node/Express + base de datos) que describiste, para el cual este diseño puede servir de referencia visual.' +
      '</div>' +

      '<button class="btn" style="width:fit-content;" onclick="App.logout()">🚪 Cerrar sesión</button>' +
    '</div>';
  }
};

/* ---------- helpers de layout ---------- */
function field(label, inputHtml) { return '<div><label class="f-label">' + esc(label) + '</label>' + inputHtml + '</div>'; }
function sectionTitle(title, subtitle) {
  return '<div><div class="head" style="font-size:24px;font-weight:700;">' + esc(title) + '</div>' +
    (subtitle ? '<div style="font-size:13px;color:var(--text-dim);">' + esc(subtitle) + '</div>' : '') + '</div>';
}
function infoCard(title, innerHtml) {
  return '<div class="card" style="padding:16px;"><div style="font-weight:600;margin-bottom:10px;">' + title + '</div>' + innerHtml + '</div>';
}

App.init();
</script>
</body>
</html>
